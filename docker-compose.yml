# App containers: read-only filesystem (writes only to /tmp and their volume), no Linux
# capabilities, no privilege escalation.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    restart: unless-stopped
    environment:
      POSTGRES_USER: bimmerdash
      POSTGRES_DB: bimmerdash
      POSTGRES_PASSWORD: ${BIMMERDASH_DB_PASSWORD:?set BIMMERDASH_DB_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - bimmerdash-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bimmerdash -d bimmerdash"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    image: ghcr.io/downeddart/bimmerdash-collector:${BIMMERDASH_VERSION:-latest}
    <<: *hardened
    restart: unless-stopped
    env_file: .env
    environment:
      BIMMERDASH_DATABASE_URL: postgresql://bimmerdash:${BIMMERDASH_DB_PASSWORD}@db:5432/bimmerdash
    volumes:
      - bimmerdash-data:/data
    depends_on:
      db:
        condition: service_healthy
    command: ["stream"]

  prices:
    # UK fuel price history from the Fuel Finder open data scheme (optional).
    image: ghcr.io/downeddart/bimmerdash-collector:${BIMMERDASH_VERSION:-latest}
    <<: *hardened
    restart: unless-stopped
    env_file: .env
    environment:
      BIMMERDASH_DATABASE_URL: postgresql://bimmerdash:${BIMMERDASH_DB_PASSWORD}@db:5432/bimmerdash
    depends_on:
      db:
        condition: service_healthy
    command: ["prices"]

  web:
    image: ghcr.io/downeddart/bimmerdash-web:${BIMMERDASH_VERSION:-latest}
    <<: *hardened
    restart: unless-stopped
    environment:
      # With BIMMERDASH_WEB_DB_USER=bimmerdash_web and BIMMERDASH_WEB_DB_PASSWORD set, the UI
      # uses a role that can only write its own tables (see .env.example).
      BIMMERDASH_DATABASE_URL: postgresql://${BIMMERDASH_WEB_DB_USER:-bimmerdash}:${BIMMERDASH_WEB_DB_PASSWORD:-${BIMMERDASH_DB_PASSWORD}}@db:5432/bimmerdash
      BIMMERDASH_LOG_LEVEL: ${BIMMERDASH_LOG_LEVEL:-INFO}
      BIMMERDASH_AUTH: ${BIMMERDASH_AUTH:-on}
      # Behind an HTTPS reverse proxy: the proxy's address, so uvicorn trusts its headers.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      BIMMERDASH_COOKIE_SECURE: ${BIMMERDASH_COOKIE_SECURE:-auto}
    ports:
      # Plain HTTP: fine on your LAN. For access from outside, put HTTPS in front.
      - "${BIMMERDASH_WEB_PORT:-8320}:8320"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bimmerdash-data:
  bimmerdash-db:
