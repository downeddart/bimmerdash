services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bimmerdash
      POSTGRES_DB: bimmerdash
      POSTGRES_PASSWORD: ${BIMMERDASH_DB_PASSWORD:?set BIMMERDASH_DB_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - bimmerdash-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bimmerdash -d bimmerdash"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    image: ghcr.io/downeddart/bimmerdash-collector:${BIMMERDASH_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      BIMMERDASH_DATABASE_URL: postgresql://bimmerdash:${BIMMERDASH_DB_PASSWORD}@db:5432/bimmerdash
    volumes:
      - bimmerdash-data:/data
    depends_on:
      db:
        condition: service_healthy
    command: ["stream"]

  prices:
    # UK fuel price history from the Fuel Finder open data scheme (optional).
    image: ghcr.io/downeddart/bimmerdash-collector:${BIMMERDASH_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      BIMMERDASH_DATABASE_URL: postgresql://bimmerdash:${BIMMERDASH_DB_PASSWORD}@db:5432/bimmerdash
    depends_on:
      db:
        condition: service_healthy
    command: ["prices"]

  web:
    image: ghcr.io/downeddart/bimmerdash-web:${BIMMERDASH_VERSION:-latest}
    restart: unless-stopped
    environment:
      BIMMERDASH_DATABASE_URL: postgresql://bimmerdash:${BIMMERDASH_DB_PASSWORD}@db:5432/bimmerdash
      BIMMERDASH_LOG_LEVEL: ${BIMMERDASH_LOG_LEVEL:-INFO}
    ports:
      # No login yet: keep this on your LAN or behind a reverse proxy with auth.
      - "${BIMMERDASH_WEB_PORT:-8320}:8320"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bimmerdash-data:
  bimmerdash-db:
