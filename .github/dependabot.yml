# Keeps the pinned versions current: actions (by commit SHA), base images (by digest),
# Python dependencies (hash-locked requirements.txt) and the frontend lockfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/collector, /web]
    schedule: { interval: weekly }
    # Base image versions move by hand: both images on the same Python once its wheels
    # (Pillow, psycopg) exist, and Node on an LTS line. Digest updates still come through.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directories: [/collector, /web]
    schedule: { interval: weekly }
    groups: { python: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /web/frontend
    schedule: { interval: weekly }
    groups:
      # Vite and its Svelte plugin must move together (peer dependencies).
      vite: { patterns: [vite, "@sveltejs/vite-plugin-svelte*"] }
      frontend: { update-types: [minor, patch] }
