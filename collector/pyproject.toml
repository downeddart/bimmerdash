[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bimmerdash"
version = "0.1.0"
description = "Self-hosted logger and dashboard for BMW CarData"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "paho-mqtt>=2.1,<3",
    "pillow>=11,<14",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
bimmerdash = "bimmerdash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bimmerdash = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
